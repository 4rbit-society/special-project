<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <linearGradient id="pp-cat-disc" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#D7FCEE"/>
      <stop offset="100%" stop-color="#9BEBDC"/>
    </linearGradient>
    <linearGradient id="pp-cat-fur" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFB65C"/>
      <stop offset="100%" stop-color="#F68C2E"/>
    </linearGradient>
    <clipPath id="pp-cat-clip">
      <circle cx="80" cy="80" r="76"/>
    </clipPath>
  </defs>
  <circle cx="80" cy="80" r="76" fill="url(#pp-cat-disc)"/>
  <g clip-path="url(#pp-cat-clip)">
    <!-- Ears -->
    <path d="M38 71L34 36C33.5 30.5 39.5 27.5 44 31L67 48L38 71Z" fill="#F8983C"/>
    <path d="M122 71L126 36C126.5 30.5 120.5 27.5 116 31L93 48L122 71Z" fill="#F8983C"/>
    <path d="M43 62L40 39L57 51L43 62Z" fill="#FFA6B0"/>
    <path d="M117 62L120 39L103 51L117 62Z" fill="#FFA6B0"/>
    <!-- Head -->
    <ellipse cx="80" cy="91" rx="46" ry="39" fill="url(#pp-cat-fur)"/>
    <!-- Forehead stripes -->
    <rect x="77" y="52" width="6" height="15" rx="3" fill="#DF721C"/>
    <rect x="65" y="54" width="5.2" height="12" rx="2.6" transform="rotate(-10 65 54)" fill="#DF721C"/>
    <rect x="89.8" y="53" width="5.2" height="12" rx="2.6" transform="rotate(10 89.8 53)" fill="#DF721C"/>
    <!-- Cheek stripes -->
    <path d="M36 86H45" stroke="#DF721C" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M36 94.5H44" stroke="#DF721C" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M115 86H124" stroke="#DF721C" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M116 94.5H124" stroke="#DF721C" stroke-width="3.4" stroke-linecap="round"/>
    <!-- Eyes -->
    <ellipse cx="61.5" cy="87.5" rx="4.8" ry="5.6" fill="#2B1C14"/>
    <ellipse cx="98.5" cy="87.5" rx="4.8" ry="5.6" fill="#2B1C14"/>
    <!-- Blush -->
    <ellipse cx="49.5" cy="97.5" rx="7.5" ry="4.5" fill="#FF8494" opacity="0.72"/>
    <ellipse cx="110.5" cy="97.5" rx="7.5" ry="4.5" fill="#FF8494" opacity="0.72"/>
    <!-- Nose & w-smile -->
    <path d="M76.5 94C76.5 92.5 83.5 92.5 83.5 94L80 98.5L76.5 94Z" fill="#FF6B7D"/>
    <path d="M71.5 101C73.8 105 78.8 104.5 80 100C81.2 104.5 86.2 105 88.5 101" stroke="#3E2517" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Delicate inner-cheek whiskers -->
    <g stroke="#5C3419" stroke-width="1.8" stroke-linecap="round" opacity="0.8">
      <path d="M27 91L41 94"/>
      <path d="M27 99L40 99"/>
      <path d="M133 91L119 94"/>
      <path d="M133 99L120 99"/>
    </g>
  </g>
</svg>