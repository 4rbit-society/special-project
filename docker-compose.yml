services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-localpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-special_project}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-localpassword}", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-init:
    build:
      context: .
      target: build
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-localpassword}
      DB_NAME: ${MYSQL_DATABASE:-special_project}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-16}
    command: sh -c "npm run db:schema -w @starter/api && npm run db:seed -w @starter/api"
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      target: runtime
    environment:
      PORT: 3001
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-localpassword}
      DB_NAME: ${MYSQL_DATABASE:-special_project}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-16}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
    ports:
      - "3001:3001"
    depends_on:
      db-init:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  db-data:
