<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" fill="none">
  <defs>
    <linearGradient id="pp-clock-body" x1="20%" y1="15%" x2="80%" y2="85%">
      <stop offset="0%" stop-color="#FFE66D"/>
      <stop offset="100%" stop-color="#F7B11A"/>
    </linearGradient>
  </defs>
  <!-- Top hammer -->
  <rect x="67" y="20" width="6" height="12" rx="3" fill="#0F295C"/>
  <rect x="62" y="18" width="16" height="5" rx="2.5" fill="#0F295C"/>
  <!-- Twin bells -->
  <path d="M35 43C27 36 28 24 37 20C44 17 51 22 53 30" fill="#FFE066" stroke="#0F295C" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M105 43C113 36 112 24 103 20C96 17 89 22 87 30" fill="#FFE066" stroke="#0F295C" stroke-width="3.4" stroke-linecap="round"/>
  <!-- Sound waves -->
  <path d="M22 24C18 28 17 34 19 39" stroke="#F59F00" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M118 24C122 28 123 34 121 39" stroke="#F59F00" stroke-width="3.4" stroke-linecap="round"/>
