<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <linearGradient id="cat-svg-disc" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#D4FAEC"/>
      <stop offset="100%" stop-color="#9BEBDC"/>
    </linearGradient>
    <linearGradient id="cat-svg-fur" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFB258"/>
      <stop offset="100%" stop-color="#F68A2D"/>
    </linearGradient>
    <clipPath id="cat-svg-clip">
      <circle cx="80" cy="80" r="74"/>
    </clipPath>
  </defs>
  <circle cx="80" cy="80" r="74" fill="url(#cat-svg-disc)" stroke="#FFFFFF" stroke-width="4"/>
  <g clip-path="url(#cat-svg-clip)">
    <!-- Ears -->
    <path d="M36 68L31 30C30 24 37 21 42 25L66 44L36 68Z" fill="#F68A2D"/>
    <path d="M124 68L129 30C130 24 123 21 118 25L94 44L124 68Z" fill="#F68A2D"/>
    <path d="M40 60L37 35L56 49L40 60Z" fill="#FFA4A9"/>
    <path d="M120 60L123 35L104 49L120 60Z" fill="#FFA4A9"/>
    <!-- Head -->
    <ellipse cx="80" cy="88" rx="48" ry="42" fill="url(#cat-svg-fur)"/>
    <!-- Forehead stripes -->
    <rect x="76.5" y="47" width="7" height="17" rx="3.5" fill="#D96814"/>
    <rect x="64" y="49" width="6" height="13" rx="3" transform="rotate(-12 64 49)" fill="#D96814"/>
    <rect x="90" y="48" width="6" height="13" rx="3" transform="rotate(12 90 48)" fill="#D96814"/>
    <!-- Cheek stripes -->
    <path d="M35 84H45" stroke="#D96814" stroke-width="4" stroke-linecap="round"/>
    <path d="M34 94H44" stroke="#D96814" stroke-width="4" stroke-linecap="round"/>
    <path d="M115 84H125" stroke="#D96814" stroke-width="4" stroke-linecap="round"/>
    <path d="M116 94H126" stroke="#D96814" stroke-width="4" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="60" cy="83" r="8" fill="#1C2541"/>
    <circle cx="100" cy="83" r="8" fill="#1C2541"/>
    <circle cx="62.5" cy="80.5" r="2.6" fill="#FFFFFF"/>
    <circle cx="102.5" cy="80.5" r="2.6" fill="#FFFFFF"/>
    <!-- Cheeks -->
    <ellipse cx="49" cy="96" rx="8" ry="5" fill="#FF7C8A" opacity="0.72"/>
    <ellipse cx="111" cy="96" rx="8" ry="5" fill="#FF7C8A" opacity="0.72"/>
    <!-- Muzzle -->
    <ellipse cx="80" cy="99" rx="17" ry="12" fill="#FFF0D6"/>
    <!-- Nose & mouth -->
    <path d="M75 94C75 92 85 92 85 94L80 100L75 94Z" fill="#FF6B7D"/>
    <path d="M72 103C74 107 79 107 80 102C81 107 86 107 88 103" stroke="#5C3216" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Whiskers -->
    <g stroke="#FFFDF8" stroke-width="2.4" stroke-linecap="round">
      <path d="M22 88L40 92"/>
      <path d="M21 97L39 98"/>
      <path d="M138 88L120 92"/>
      <path d="M139 97L121 98"/>
    </g>
  </g>
</svg>