  <path d="M48 106L40 118" stroke="#0F295C" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M92 106L100 118" stroke="#0F295C" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Clock shell & dial -->
  <circle cx="70" cy="72" r="40" fill="url(#pp-clock-body)" stroke="#0F295C" stroke-width="3.5"/>
  <circle cx="70" cy="72" r="30" fill="#FFFFFF" stroke="#0F295C" stroke-width="2.4"/>
